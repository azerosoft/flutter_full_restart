// Written in Groovy and Java on purpose: this works with every Android Gradle
// Plugin from 7.x to 9.x without needing the Kotlin Gradle Plugin, so it builds
// in both old and new Flutter projects.
group = "com.azerosoft.flutter_full_restart"
// Read from pubspec.yaml, so a release only changes the version there.
version = file("../pubspec.yaml").readLines().find { it.startsWith("version:") }.substring(8).trim()

apply plugin: "com.android.library"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.azerosoft.flutter_full_restart"
    }

    compileSdk = 34

    defaultConfig {
        minSdk = 21
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
