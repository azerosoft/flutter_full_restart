# After CI passes on main, release-please keeps a single release pull request
# up to date with the next version and its changelog, worked out from the
# commit messages. Merging that pull request creates the tag and the GitHub
# release, and this workflow then starts the publish workflow on the new tag.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Tags created with the workflow token do not start other workflows, so
      # the publish workflow is started on the new tag directly.
      - if: steps.release.outputs.release_created
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
