# After CI passes on main, release-please keeps a single release pull request
# up to date with the next version and its changelog, worked out from the
# commit messages. Merging that pull request creates the tag and the GitHub
# release, and this workflow then starts the publish workflow on the new tag.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: write

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      # release-please works as the Azerosoft release bot. Pull requests opened
      # with the default workflow token need a maintainer's approval before CI
      # runs on them; the bot's pull requests do not.
      - uses: actions/create-github-app-token@v3
        id: bot
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.bot.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: steps.release.outputs.release_created
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
