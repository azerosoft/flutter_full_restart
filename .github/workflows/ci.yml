name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job runs on the oldest supported Flutter version and on the latest
# stable release. The oldest version runs on fixed runner images and tools
# from its own time, so newer tools on the latest images cannot break it. The
# example's platform folders come from the latest Flutter template, so on the
# oldest version each job first recreates the folder it builds with that
# version's own template.

jobs:
  test:
    name: Analyze and test (Flutter ${{ matrix.flutter }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: '3.22.3'
            os: ubuntu-24.04
          - flutter: stable
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
        if: matrix.flutter == 'stable'
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: example
      - run: flutter pub publish --dry-run
        if: matrix.flutter == 'stable'

  android:
    name: Build Android example (Flutter ${{ matrix.flutter }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: '3.22.3'
            os: ubuntu-24.04
          - flutter: stable
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
      - run: .github/scripts/recreate_example_platform.sh android
        if: matrix.flutter != 'stable'
      - run: flutter build apk --debug
        working-directory: example

  ios:
    name: Build iOS example (Flutter ${{ matrix.flutter }}, ${{ matrix.dependencies }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flutter 3.22 has no Swift Package Manager support.
          - flutter: '3.22.3'
            os: macos-15
            xcode: '16.4'
            dependencies: CocoaPods
          - flutter: stable
            os: macos-latest
            dependencies: Swift Package Manager
          - flutter: stable
            os: macos-latest
            dependencies: CocoaPods
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select --switch /Applications/Xcode_${{ matrix.xcode }}.app
        if: matrix.xcode
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
      - run: flutter config --no-enable-swift-package-manager
        if: matrix.flutter == 'stable' && matrix.dependencies == 'CocoaPods'
      - run: .github/scripts/recreate_example_platform.sh ios
        if: matrix.flutter != 'stable'
      - run: flutter build ios --simulator --debug
        working-directory: example

  macos:
    name: Build macOS example (Flutter ${{ matrix.flutter }}, ${{ matrix.dependencies }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flutter 3.22 has no Swift Package Manager support.
          - flutter: '3.22.3'
            os: macos-15
            xcode: '16.4'
            dependencies: CocoaPods
          - flutter: stable
            os: macos-latest
            dependencies: Swift Package Manager
          - flutter: stable
            os: macos-latest
            dependencies: CocoaPods
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select --switch /Applications/Xcode_${{ matrix.xcode }}.app
        if: matrix.xcode
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
      - run: flutter config --no-enable-swift-package-manager
        if: matrix.flutter == 'stable' && matrix.dependencies == 'CocoaPods'
      - run: .github/scripts/recreate_example_platform.sh macos
        if: matrix.flutter != 'stable'
      - run: flutter build macos --debug
        working-directory: example

  web:
    name: Build web example (Flutter ${{ matrix.flutter }}, WebAssembly)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: '3.22.3'
            os: ubuntu-24.04
          - flutter: stable
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
      - run: .github/scripts/recreate_example_platform.sh web
        if: matrix.flutter != 'stable'
      - run: flutter build web --wasm
        working-directory: example

  linux:
    name: Build Linux example and run C++ tests (Flutter ${{ matrix.flutter }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: '3.22.3'
            os: ubuntu-24.04
          - flutter: stable
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
      - run: .github/scripts/recreate_example_platform.sh linux
        if: matrix.flutter != 'stable'
      - run: flutter build linux --debug
        working-directory: example
      - run: ./build/linux/x64/debug/plugins/flutter_full_restart/flutter_full_restart_test
        working-directory: example

  windows:
    name: Build Windows example and run C++ tests (Flutter ${{ matrix.flutter }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: '3.22.3'
            os: windows-2022
          - flutter: stable
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
      - run: .github/scripts/recreate_example_platform.sh windows
        if: matrix.flutter != 'stable'
        shell: bash
      - run: flutter build windows --debug
        working-directory: example
      - run: .\build\windows\x64\plugins\flutter_full_restart\Debug\flutter_full_restart_test.exe
        working-directory: example
