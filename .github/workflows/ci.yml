name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze and test (Flutter ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '3.22.3 (minimum)'
            version: '3.22.3'
          - label: 'latest stable'
            version: ''
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.version }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
        if: matrix.version == ''
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --dry-run
        if: matrix.version == ''

  android:
    name: Build Android example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build apk --debug
        working-directory: example

  ios:
    name: Build iOS example (Swift Package Manager)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build ios --simulator --debug
        working-directory: example

  macos:
    name: Build macOS example (Swift Package Manager)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build macos --debug
        working-directory: example

  web:
    name: Build web example (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build web --wasm
        working-directory: example

  linux:
    name: Build Linux example and run C++ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build linux --debug
        working-directory: example
      - run: ./build/linux/x64/debug/plugins/flutter_full_restart/flutter_full_restart_test
        working-directory: example

  windows:
    name: Build Windows example and run C++ tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build windows --debug
        working-directory: example
      - run: .\build\windows\x64\plugins\flutter_full_restart\Debug\flutter_full_restart_test.exe
        working-directory: example
