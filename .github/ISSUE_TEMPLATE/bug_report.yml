name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much as you can, it helps us fix it faster.
        For security issues, please follow [SECURITY.md](https://github.com/azerosoft/flutter_full_restart/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Call `FullRestart.restart(...)` with ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code sample
      description: The smallest code that reproduces the problem.
      render: dart
  - type: checkboxes
    id: platforms
    attributes:
      label: Affected platforms
      options:
        - label: Android
        - label: iOS
        - label: macOS
        - label: Web
        - label: Windows
        - label: Linux
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `flutter doctor -v`
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant console output, for example lines starting with `[flutter_full_restart]`.
      render: shell
