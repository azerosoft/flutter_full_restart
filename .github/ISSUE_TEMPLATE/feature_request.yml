name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in and what is missing today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work, ideally with an example of the API.
      render: dart
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: Android
        - label: iOS
        - label: macOS
        - label: Web
        - label: Windows
        - label: Linux
